<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" role="img" aria-labelledby="samediff-logo-title">
  <title id="samediff-logo-title">SameDiff Lens</title>
  <!-- Back panel (version A) -->
  <rect x="20" y="28" width="54" height="64" rx="7" ry="7"
        stroke="#1f2937" stroke-width="3.5" stroke-opacity="0.38" />
  <!-- Front panel (version B) -->
  <rect x="46" y="28" width="54" height="64" rx="7" ry="7"
        stroke="#1f2937" stroke-width="3.5" />
  <!-- Lens ring -->
  <circle cx="60" cy="60" r="22"
          stroke="#1f2937" stroke-width="3.5" />
  <!-- Aligned content line -->
  <line x1="48" y1="55" x2="72" y2="55"
        stroke="#1f2937" stroke-width="3" stroke-linecap="round" stroke-opacity="0.7" />
  <!-- Drifted content line (accent) -->
  <line x1="48" y1="65" x2="66" y2="65"
        stroke="#d97706" stroke-width="3" stroke-linecap="round" />
</svg>
