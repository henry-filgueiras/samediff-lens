name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Compute Vite base path
        id: base-path
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          owner_name="${GITHUB_REPOSITORY_OWNER}"

          if [ "${repo_name}" = "${owner_name}.github.io" ]; then
            echo "vite_base_path=/" >> "${GITHUB_OUTPUT}"
          else
            echo "vite_base_path=/${repo_name}/" >> "${GITHUB_OUTPUT}"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ steps.base-path.outputs.vite_base_path }}

      # Build the CLI and generate the example reports so they ship with
      # the Pages site. End-users get to inspect the rendered HTML at
      # `<pages-url>/examples/findings.html` (the splash) and at
      # `<pages-url>/examples/<slug>/findings.html` per example, without
      # cloning or installing anything.
      - name: Build CLI
        run: npm run build:cli

      - name: Generate example reports
        run: bash examples/generate.sh

      # Mirror every generated *.html under examples/ into dist/examples/
      # so the existing upload-pages-artifact step picks them up.
      - name: Stage example reports into dist
        run: |
          set -euo pipefail
          mkdir -p dist/examples
          while IFS= read -r -d '' f; do
            rel="${f#examples/}"
            dest="dist/examples/$rel"
            mkdir -p "$(dirname "$dest")"
            cp "$f" "$dest"
          done < <(find examples -type f -name '*.html' -print0)
          # Also copy each example's README.md and the source markdown so a
          # curious reader can compare the rendered report against the input.
          while IFS= read -r -d '' f; do
            rel="${f#examples/}"
            dest="dist/examples/$rel"
            mkdir -p "$(dirname "$dest")"
            cp "$f" "$dest"
          done < <(find examples -type f \( -name '*.md' -o -name '*.markdown' \) -print0)
          echo "Staged $(find dist/examples -type f | wc -l | tr -d ' ') files into dist/examples/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
